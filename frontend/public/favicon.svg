<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MediTwin">
  <defs>
    <linearGradient id="mtTile" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="17" fill="url(#mtTile)"/>

  <!-- Physical robot: solid peak -->
  <path d="M15 46 L25 18 L35 46 Z" fill="#FFFFFF"/>

  <!-- Digital twin: the same form, simulated -->
  <path d="M29 46 L39 18 L49 46 Z"
        fill="none" stroke="#FFFFFF" stroke-width="3.25"
        stroke-linejoin="round" stroke-dasharray="6.5 5" opacity="0.95"/>

  <!-- Mirror axis -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#FCD34D"
        stroke-width="2" stroke-dasharray="3 4"/>
</svg>
